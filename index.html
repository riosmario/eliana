<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cielito de Eliana - Tienda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <!-- Grupo de Logo + Título -->
            <div class="brand-group">
                <img src="img/LOGO_REDONDO.png" alt="Logo El Cielito" class="header-logo">
                <h1 id="main-title">CATALOGO <br> <span>WEB</span></h1>
            </div>

            <!-- Buscador extendido -->
            <div class="search-container">
                <input type="text" id="buscador" placeholder="Buscar productos..." onkeyup="buscarProductos()">
                <button class="btn-search-icon"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <!-- BARRA NAVEGADORA Y ACCIONES (Coral) -->
    <nav class="nav-bar">
        <div class="nav-content">
            <div class="nav-left">
                <button class="btn-categoria-nav">
                    <i class="fas fa-bars"></i> Categorías
                </button>
                <span class="nav-link">Tienda</span>
            </div>

            <div class="header-acciones">
                <button id="btn-volver" onclick="mostrarRubros()" class="btn-volver-estilo" style="display: none;">
                    <i class="fas fa-arrow-left"></i> VOLVER
                </button>
                <button onclick="abrirModal()" class="btn-cart-header">
                    <i class="fas fa-shopping-cart"></i> <span id="cart-counter">$0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- BANNER DE PORTADA / PROMOCIÓN -->
    <div id="banner-promocional" class="banner-promo">
        <p class="promo-text"><i class="fas fa-dollar-sign"></i> PRECIOS EXCLUSIVOS PARA COMPRAS WEB <i
                class="fas fa-dollar-sign"></i></p>
    </div>

    <div id="filtros-textil" class="sub-rubros" style="display: none;">
        <button class="btn-sub btn-sub-inactivo" disabled>HOMBRE</button>
        <button class="btn-sub btn-sub-activo" onclick="filtrarPorSub('Mujer', this)">MUJER</button>
        <button class="btn-sub btn-sub-inactivo" disabled>NIÑOS</button>
        <button class="btn-sub btn-sub-inactivo" disabled>NENA</button>
        <button class="btn-sub btn-sub-inactivo" disabled>BEBÉ</button>
        <button class="btn-sub btn-sub-inactivo" disabled>TODOS</button>
    </div>

    <main class="container">
        <section id="productos-grid" class="grid-container"></section>
    </main>

    <!-- BANNER INFERIOR PRE-FOOTER (Bright Teal) -->
    <div class="footer-banner">
        <span>🌈 EL CIELITO DE ELIANA</span>
    </div>

    <!-- MODAL DEL CARRITO -->
    <div id="modal-carrito" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>📋 Resumen de Pedido</h2>
            <div id="lista-carrito"></div>
            <div class="total-container">
                <strong>Total:</strong> <span id="total-precio">$0</span>
            </div>
            <div id="datos-envio"
                style="margin: 15px 0; padding: 12px; border: 1px solid #e0e0e0; border-radius: 12px; background-color: #f9f9f9;">
                <p style="font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; color: #333; text-align: center;">
                    📝 Datos para el pedido</p>

                <input type="text" id="nombre-cliente" placeholder="Tu Nombre y Apellido (Obligatorio)"
                    style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">

                <input type="text" id="direccion-cliente" placeholder="Observaciones -> ejemplo: retiro a la tarde"
                    style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>
            <button id="btn-whatsapp" onclick="enviarWhatsApp()">🚀 Enviar Pedido por WhatsApp</button>
            <button onclick="cerrarModal()" class="btn-continue">Continuar comprando</button>
        </div>
    </div>

    <!-- MODAL DE ZOOM -->
    <div id="modal-imagen" class="modal-img" onclick="cerrarImagen(event)">
        <div class="modal-zoom-contenido" onclick="event.stopPropagation()">
            <span class="close-img-btn" onclick="cerrarImagen(event)">&times;</span>

            <div class="modal-img-container">
                <img id="img-agrandada" src="" alt="Producto Agrandado">
            </div>

            <div class="zoom-info-card">
                <div class="zoom-textos">
                    <h3 id="zoom-titulo">Nombre del Producto</h3>
                    <p id="zoom-precio" class="precio">$0</p>
                </div>

                <div class="zoom-action-container">
                    <span id="mensaje-confirmacion" class="mensaje-agregado">¡Agregado al carrito!</span>
                    <button id="zoom-btn-add" class="btn-add">+</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-info">
            <p><i class="fas fa-map-marker-alt"></i> Sebastián Gaboto 1412, Córdoba</p>
            <p><i class="fas fa-phone-alt"></i> 3513018831</p>
            <div class="social-links">
                <i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i>
            </div>
            <p class="copyright">© 2026 - Catalog design</p>
        </div>
    </footer>

    <script src="productos.js"></script>
    <script src="script.js"></script>
</body>

</html>
